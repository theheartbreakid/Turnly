name: Android CI Release

on:
  push:
    branches: [ "master" ] 
  workflow_dispatch:      

permissions:
  contents: write         

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches all tags from git history to calculate the version bump accurately

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'        
        distribution: 'zulu'
        
    - name: Decode Keystore from Secrets
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release-keystore.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Wipe Cache and Build Fresh Release APK
      run: |
        ./gradlew clean assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release-keystore.jks \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
          -x test -x lint

    - name: Calculate Next Version Tag
      id: tagger
      run: |
        # Fetch the latest version tag. Defaults to v1.0.0 if it's the very first run.
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
        echo "Current Tag: $LATEST_TAG"
        
        # Remove the 'v' character prefix
        VERSION_CLEAN=${LATEST_TAG#v}
        
        # Split semantic version into major, minor, and patch components
        IFS='.' read -r major minor patch <<< "$VERSION_CLEAN"
        
        MAJOR=${major:-1}
        MINOR=${minor:-0}
        PATCH=${patch:-0}
        
        # Increment the patch version integer by 1 (e.g., 0 -> 1)
        NEXT_PATCH=$((PATCH + 1))
        NEXT_TAG="v$MAJOR.$MINOR.$NEXT_PATCH"
        
        echo "Next Tag Calculation: $NEXT_TAG"
        echo "next_version=$NEXT_TAG" >> $GITHUB_OUTPUT

    - name: Automatic GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "${{ steps.tagger.outputs.next_version }}"
        name: "${{ steps.tagger.outputs.next_version }}" # Clean naming scheme without extra title words
        draft: false
        prerelease: false
        generate_release_notes: true # Auto-generates your "What's Changed" log directly from commits [INDEX]
        files: |
          app/release/app-release.apk
          app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
